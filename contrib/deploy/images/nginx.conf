worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr;
events {}
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        location = /check-profile-admin {
            internal;
            proxy_pass http://auth:3000/api/v1/servers;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }
        location = /api/v1/starter-profiles/index.json {
            auth_request /check-profile-admin;
            add_header Cache-Control "no-store" always;
            alias /srv/anet-profiles/index.json;
        }
        location ~ ^/api/v1/starter-profiles/files/([a-zA-Z0-9_-]+\.(?:conf|toml|uri))$ {
            auth_request /check-profile-admin;
            add_header Cache-Control "no-store" always;
            add_header Content-Disposition attachment;
            default_type application/octet-stream;
            alias /srv/anet-profiles/files/$1;
        }
        location ^~ /api/v1/subscriptions/ {
            access_log off;
            error_log /dev/null;
            limit_except GET { deny all; }
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            add_header Cache-Control "no-store" always;
            proxy_pass http://auth:3000;
        }
        location ~ ^/api/v1/ingress-sync/[A-Za-z0-9_-]+$ {
            limit_except POST { deny all; }
            client_max_body_size 64k;
            access_log off;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            add_header Cache-Control "no-store" always;
            proxy_pass http://auth:3000;
        }
        location ~ ^/api/v1/vless-usage/profile-[1-9][0-9]*$ {
            limit_except POST { deny all; }
            client_max_body_size 32k;
            access_log off;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            resolver 127.0.0.11 valid=10s;
            set $profile_backend http://vless-profiles:8093;
            proxy_pass $profile_backend$request_uri;
        }
        location ^~ /api/v1/vless-subscriptions/ {
            access_log off;
            error_log /dev/null;
            limit_except GET { deny all; }
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            resolver 127.0.0.11 valid=10s;
            set $profile_backend http://vless-profiles:8093;
            proxy_pass $profile_backend$request_uri;
        }
        location ~ ^/api/v1/vless-devices(?:/|$) {
            resolver 127.0.0.11 valid=10s;
            set $profile_backend http://vless-profiles:8093;
            proxy_pass $profile_backend$request_uri;
        }
        location ^~ /api/v1/node-install/ {
            client_max_body_size 8k;
            access_log off;
            add_header Cache-Control "no-store" always;
            resolver 127.0.0.11 valid=10s;
            set $node_installer http://node-install:8092;
            proxy_pass $node_installer$request_uri;
        }
        location /api/ {
            add_header Cache-Control "no-store" always;
            proxy_pass http://auth:3000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
