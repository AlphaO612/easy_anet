services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996}
    networks: [metrics, panel]
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=14d, --web.enable-remote-write-receiver]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ${STATE_DIR:?}/central-prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - probe-targets:/etc/prometheus/targets:ro
      - metrics:/prometheus
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    mem_limit: ${PROMETHEUS_MEMORY:-512m}
    cpus: ${PROMETHEUS_CPUS:-1}
    pids_limit: 128
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.1.1@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d}
    networks: [metrics, panel]
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/admin_password
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    secrets: [admin_password]
    ports: ["127.0.0.1:${GRAFANA_PORT:-3001}:3000"]
    volumes:
      - grafana:/var/lib/grafana
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    tmpfs: [/tmp]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    mem_limit: ${GRAFANA_MEMORY:-384m}
    cpus: ${GRAFANA_CPUS:-1}
    pids_limit: 128
  blackbox:
    image: ${BLACKBOX_IMAGE:-prom/blackbox-exporter:v0.27.0@sha256:a50c4c0eda297baa1678cd4dc4712a67fdea713b832d43ce7fcc5f9bea05094d}
    networks: [metrics, vpn]
    command: [--config.file=/etc/blackbox/anet.yml]
    volumes: [../../monitoring/blackbox.yml:/etc/blackbox/anet.yml:ro]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    mem_limit: ${BLACKBOX_MEMORY:-96m}
    pids_limit: 64
  auth:
    environment:
      ANET_PROMETHEUS_URL: http://prometheus:9090
    networks: [metrics]
secrets:
  admin_password:
    file: ${STATE_DIR:?}/grafana-password
volumes:
  metrics:
  grafana:
networks:
  metrics: {internal: true}
