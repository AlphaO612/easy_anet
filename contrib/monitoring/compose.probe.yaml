name: anet-probe
services:
  agent:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command: [--agent, --config.file=/etc/prometheus/agent.yml, --storage.agent.path=/prometheus]
    volumes:
      - ${AGENT_CONFIG:?Set AGENT_CONFIG}:/etc/prometheus/agent.yml:ro
      - ${TARGETS_DIR:?Set TARGETS_DIR}:/etc/prometheus/targets:ro
      - ${AGENT_TLS_DIR:?Set AGENT_TLS_DIR}:/etc/anet/tls:ro
      - queue:/prometheus
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 96
    mem_limit: ${AGENT_MEMORY:-192m}
    cpus: ${AGENT_CPUS:-0.5}
  blackbox:
    image: prom/blackbox-exporter:v0.27.0@sha256:a50c4c0eda297baa1678cd4dc4712a67fdea713b832d43ce7fcc5f9bea05094d
    command: [--config.file=/etc/blackbox/anet.yml]
    volumes: [./blackbox.yml:/etc/blackbox/anet.yml:ro]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: ${BLACKBOX_MEMORY:-96m}
    cpus: ${BLACKBOX_CPUS:-0.5}
volumes:
  queue:
