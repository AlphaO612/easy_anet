worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 64; }
http {
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    scgi_temp_path /tmp/scgi;
    uwsgi_temp_path /tmp/uwsgi;
    limit_req_zone $ssl_client_fingerprint zone=client:1m rate=6r/m;
    limit_req_zone $server_name zone=total:1m rate=2r/s;
    server {
        listen 9444 ssl;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /etc/anet/tls/server.crt;
        ssl_certificate_key /etc/anet/tls/server.key;
        ssl_client_certificate /etc/anet/tls/ca.crt;
        ssl_verify_client on;
        location = /anet/capacity.bin {
            if ($request_method != GET) { return 405; }
            if ($args != "") { return 400; }
            limit_req zone=client burst=1 nodelay;
            limit_req zone=total burst=2 nodelay;
            limit_req_status 429;
            gzip off;
            max_ranges 0;
            add_header X-ANet-Capacity v1;
            add_header Cache-Control no-store;
            alias /etc/anet/payload.bin;
        }
        location / { return 404; }
    }
}
