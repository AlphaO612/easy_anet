name: anet-monitoring
services:
  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=14d, --web.enable-remote-write-receiver]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules.yml:/etc/prometheus/rules.yml:ro
      - metrics:/prometheus
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    mem_limit: ${PROMETHEUS_MEMORY:-512m}
    cpus: ${PROMETHEUS_CPUS:-1}
    pids_limit: 128
  grafana:
    image: grafana/grafana:12.1.1@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/admin_password
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    secrets: [admin_password]
    ports: ["127.0.0.1:${GRAFANA_PORT:-3001}:3000"]
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    tmpfs: [/tmp]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    mem_limit: ${GRAFANA_MEMORY:-384m}
    cpus: ${GRAFANA_CPUS:-1}
    pids_limit: 128
secrets:
  admin_password:
    file: ${GRAFANA_PASSWORD_FILE:?Set GRAFANA_PASSWORD_FILE}
volumes:
  metrics:
  grafana:
