groups:
  - name: server-links
    rules:
      - record: anet_link_capacity_mbps
        expr: |
          ((probe_http_uncompressed_body_length{job="server-link",module="https_capacity"} == 65536) * 8 / 1000000
            / (probe_duration_seconds{job="server-link",module="https_capacity"} > 0))
          and (probe_success{job="server-link",module="https_capacity"} == 1)
          and (time() - timestamp(probe_success{job="server-link",module="https_capacity"}) < 10)
      - record: anet:link_last_seen_seconds
        expr: timestamp(probe_success{job="server-link"})
      - record: anet:link_available
        expr: |
          (
            (min_over_time(probe_success{job="server-link"}[30s]) == 1)
            or (max_over_time(probe_success{job="server-link"}[30s]) == 0)
          )
          and (count_over_time(probe_success{job="server-link"}[30s]) >= 3)
          or (
            last_over_time(anet:link_available[30s])
            and present_over_time(probe_success{job="server-link"}[45s])
          )
      - alert: ServerLinkUnavailable
        expr: anet:link_available == 0
        labels:
          severity: warning
        annotations:
          summary: 'Проба {{ $labels.source_node }} → {{ $labels.target_node }} завершилась ошибкой'
      - alert: ServerLinkTelemetryMissing
        expr: |
          present_over_time(probe_success{job="server-link"}[1h])
          unless present_over_time(probe_success{job="server-link"}[45s])
        labels:
          severity: warning
        annotations:
          summary: 'Нет свежих измерений {{ $labels.source_node }} → {{ $labels.target_node }}'
